# Spice.ai runtime for Workshop
#
# One local program that serves every model below through the same
# OpenAI-compatible address: http://127.0.0.1:8090/v1
# Workshop connects to it from the AI Hub (🌶️ Spice card).
#
# Model names tell you where the thinking happens:
#   local-…  runs on this computer (private)
#   hf-…     runs at Hugging Face (online)
#
# Start it:  cd spice && spice run

version: v1
kind: Spicepod
name: workshop

models:
  # Private: Ollama on this computer. Needs Ollama running and `ollama pull llama3.2`.
  - name: local-ollama-chat
    from: openai:llama3.2
    params:
      endpoint: http://localhost:11434/v1
      openai_api_key: ollama
      system_prompt: |
        You are a calm, friendly creative partner. Use short, plain sentences and everyday words.

  # Private: Qwen's vision model through Ollama (looks at pictures, plans video edits).
  # Needs `ollama pull qwen2.5vl:3b`.
  - name: local-ollama-vision
    from: openai:qwen2.5vl:3b
    params:
      endpoint: http://localhost:11434/v1
      openai_api_key: ollama

  # Online: Qwen at Hugging Face. Needs SPICE_HUGGINGFACE_API_KEY in spice/.env
  - name: hf-qwen-chat
    from: openai:Qwen/Qwen2.5-72B-Instruct
    params:
      endpoint: https://router.huggingface.co/v1
      openai_api_key: ${ secrets:SPICE_HUGGINGFACE_API_KEY }

  - name: hf-qwen-vision
    from: openai:Qwen/Qwen2.5-VL-7B-Instruct
    params:
      endpoint: https://router.huggingface.co/v1
      openai_api_key: ${ secrets:SPICE_HUGGINGFACE_API_KEY }

  # Private: a model downloaded from Hugging Face and run by Spice itself.
  # Large download (several GB) and needs a Hugging Face token with access to
  # the model. Remove the # signs to switch it on.
  # - name: local-hf-llama
  #   from: huggingface:huggingface.co/meta-llama/Llama-3.2-3B-Instruct
  #   params:
  #     huggingface_token: ${ secrets:SPICE_HUGGINGFACE_API_KEY }

  # Private: a model folder on this computer (for example one you downloaded
  # yourself). Put it in spice/models/my-model and remove the # signs.
  # - name: local-file-model
  #   from: file:models/my-model
